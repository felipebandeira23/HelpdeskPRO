version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: helpdeskpro-db
    environment:
      POSTGRES_USER: helpdeskpro
      POSTGRES_PASSWORD: helpdeskpro
      POSTGRES_DB: helpdeskpro
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U helpdeskpro']
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: helpdeskpro-api
    ports:
      - '3001:3001'
    environment:
      DATABASE_URL: postgresql://helpdeskpro:helpdeskpro@db:5432/helpdeskpro
      JWT_SECRET: seu-secret-jwt-super-seguro
      NODE_ENV: development
      API_PORT: 3001
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./apps/api/src:/app/apps/api/src

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: helpdeskpro-web
    ports:
      - '3000:3000'
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001/api
    depends_on:
      - api
    volumes:
      - ./apps/web:/app/apps/web

volumes:
  postgres_data:
